spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_CONNECTION_STRING}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}
jwt.secret-key=${SECRET_KEY}

# Основной уровень безопасности
logging.level.org.springframework.security=DEBUG

# Фильтры аутентификации и авторизации
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.web.access=DEBUG

# Фильтр цепочки (показывает порядок вызова фильтров)
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Детализация до уровня пакетов (максимальная информация)
logging.level.org.springframework.security.web.authentication.www=TRACE
logging.level.org.springframework.security.web.access.intercept=TRACE